<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sala Virtual Prof. JC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="actions">
      <button class="icon-btn" aria-label="Menu">☰</button>
      <button class="icon-btn" aria-label="Baixar">⇩</button>
      <button class="icon-btn" aria-label="Notificações">🔔</button>
    </div>
    <div class="brand">
      <div class="crest">JT</div>
      <div><strong>Sala Virtual</strong><br><strong>Prof. JC</strong></div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1 id="pageTitle">Área do professor</h1>
      <p id="pageSubtitle">Gerencie e acompanhe suas turmas.</p>
      <div class="switcher">
        <button id="profBtn" class="active">Professor</button>
        <button id="studentBtn">Aluno</button>
      </div>
    </section>

    <section id="cards" class="cards-grid" aria-live="polite"></section>
  </main>

  <footer>© Sala Virtual Prof. JC • Matemática e Ciências</footer>

  <script src="app.js"></script>
</body>
</html>
