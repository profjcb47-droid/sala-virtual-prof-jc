 if(collection==="students")arr.sort((a,b)=>String(a.turma||"").localeCompare(String(b.turma||""),'pt-BR')||Number(a.chamada||0)-Number(b.chamada||0));
 else arr.sort((a,b)=>Number(b.id||0)-Number(a.id||0));
 return arr
}
async function cloudRequest(path,options={}){
 const method=String(options.method||'GET').toUpperCase();
 const fetchOptions={...options,cache:'no-store',headers:{...supabaseHeaders({'Cache-Control':'no-cache'}),...(options.headers||{})}};
 if(method==='GET')fetchOptions.cache='no-store';
 const r=await fetch(SUPABASE_URL+path,fetchOptions);
 if(!r.ok){const text=await r.text().catch(()=>"");throw new Error(`Supabase ${r.status}: ${text||r.statusText}`)}
 return r
}
async function cloudPull(initial=false){
 if(!cloudEnabled||cloudPullRunning||cloudPushRunning)return;
 if(cloudDirty){await cloudPushDiff();if(cloudDirty)return}
 cloudPullRunning=true;
 try{
  const r=await cloudRequest('/rest/v1/jc_records?select=collection,item_key,data,updated_at&order=collection.asc,item_key.asc');
  const rows=await r.json();
  const grouped={};CLOUD_COLLECTIONS.forEach(k=>grouped[k]=[]);
  rows.forEach(row=>{if(grouped[row.collection])grouped[row.collection].push(row)});
  if(initial&&rows.length===0){
    CLOUD_COLLECTIONS.forEach(k=>cloudShadow[k]={});
    cloudReady=true;cloudDirty=true;await cloudPushDiff(true);return;
  }
  let changed=false;
  for(const k of CLOUD_COLLECTIONS){
    /* O Supabase é a fonte oficial. Inclusive uma coleção vazia na nuvem
       precisa apagar dados antigos que ficaram somente neste aparelho. */
    const rebuilt=rebuildCollection(k,grouped[k]);
    const before=JSON.stringify(db[k]);
    db[k]=rebuilt;
    localStorage.setItem('jc_'+k,JSON.stringify(db[k]));
    if(before!==JSON.stringify(rebuilt))changed=true;
    const sm={};grouped[k].forEach(row=>sm[row.item_key]=JSON.stringify(row.data));cloudShadow[k]=sm;
  }
  cloudReady=true;cloudLastError='';cloudLastPull=Date.now();
  if(changed&&S.user){
    if(S.user.role==='student'){const fresh=db.students.find(x=>x.login===S.user.login);if(fresh)S.user={...fresh,role:'student'}}
    /* Não reconstruir a tela enquanto o aluno responde ou o professor cria uma atividade.
       A sincronização continua em segundo plano, mas o formulário e as respostas permanecem intactos. */
    if(!preserveActiveInteraction()) render();
    else updateCloudIndicators();
  }
 }catch(err){cloudLastError=err.message;console.warn('Sincronização Supabase indisponível:',err);if(initial)toast('Não foi possível conectar ao Supabase. Verifique a internet e a configuração.')}
 finally{cloudPullRunning=false;updateCloudIndicators()}
}
async function cloudPushDiff(force=false){
 if(!cloudEnabled||cloudPushRunning||(!cloudDirty&&!force))return;
 cloudPushRunning=true;clearTimeout(cloudPushTimer);cloudPushTimer=null;
 try{
  const upserts=[];const deletes=[];const now=new Date().toISOString();
  for(const k of CLOUD_COLLECTIONS){
    const current=cloudEntries(k),curSer=serializeMap(current),shadow=cloudShadow[k]||{};
    current.forEach((data,key)=>{if(force||shadow[key]!==curSer[key])upserts.push({collection:k,item_key:key,data,updated_at:now})});
    Object.keys(shadow).forEach(key=>{if(!current.has(key))deletes.push([k,key])});
  }
  if(upserts.length){
    await cloudRequest('/rest/v1/jc_records?on_conflict=collection,item_key',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(upserts)});
  }
  for(const [collection,key] of deletes){
    await cloudRequest('/rest/v1/jc_records?collection=eq.'+encodeURIComponent(collection)+'&item_key=eq.'+encodeURIComponent(key),{method:'DELETE',headers:{'Prefer':'return=minimal'}});
  }
  CLOUD_COLLECTIONS.forEach(k=>cloudShadow[k]=serializeMap(cloudEntries(k)));
  cloudDirty=false;cloudReady=true;cloudLastError="";cloudLastPush=Date.now();
 }catch(err){cloudLastError=err.message;console.warn('Falha ao enviar alterações ao Supabase:',err);cloudDirty=true}
 finally{cloudPushRunning=false;updateCloudIndicators();if(cloudDirty)cloudPushTimer=setTimeout(()=>cloudPushDiff(),1800)}
}
function scheduleCloudPush(){cloudDirty=true;updateCloudIndicators();clearTimeout(cloudPushTimer);cloudPushTimer=setTimeout(async()=>{await cloudPushDiff();if(!cloudDirty)await cloudPull(false)},120)}
function persist(){Object.keys(db).forEach(k=>localStorage.setItem("jc_"+k,JSON.stringify(db[k])));scheduleCloudPush()}
async function syncNow(showToast=false){
 try{if(cloudDirty)await cloudPushDiff();await cloudPull(false);if(showToast&&!cloudLastError)toast('Dados sincronizados com o Supabase.')}catch(err){cloudLastError=err.message;if(showToast)toast('Não foi possível sincronizar agora.')}finally{updateCloudIndicators()}
}
function cloudStatusText(){if(cloudLastError)return '☁ Sem sincronização';if(cloudDirty||cloudPushRunning)return '☁ Enviando...';if(cloudReady)return '☁ Sincronizado';return '☁ Conectando...'}
function updateCloudIndicators(){document.querySelectorAll('[data-cloud-status]').forEach(el=>{el.textContent=cloudStatusText();el.title=cloudLastError||'Sincronização online ativa • versão 3'})}
async function initCloud(){

 setInterval(()=>syncNow(false),1500);

 window.addEventListener('online',()=>syncNow(false));

}

function createInternalStudentCredentials(nome){
  const base=(nome||"aluno").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,".").replace(/^\.|\.$/g,"")||"aluno";
  let login=base, n=2;
  while(db.students.some(s=>String(s.login).toLowerCase()===login.toLowerCase())) login=base+(n++);
  const senha=String(1000+Math.floor(Math.random()*9000));
  return {login,senha};
}

function classSaveStudent(){
  const chamada=parseInt(document.getElementById("classCall").value,10);
  const turma=document.getElementById("classTurma").value;
  const nome=document.getElementById("className").value.trim();
  const original=document.getElementById("classEditOriginal").value;

  if(!chamada || chamada<1 || !nome || !turma){
    return toast("Preencha nome, número de chamada e turma.");
  }
  if(db.students.some(s=>s.turma===turma && Number(s.chamada)===chamada && s.login!==original)){
    return toast("Esse número de chamada já existe nessa turma.");
  }

  if(original){
    const idx=db.students.findIndex(s=>s.login===original);
    if(idx<0) return toast("Aluno não encontrado.");
    db.students[idx]={...db.students[idx],turma,chamada,nome};
    toast("Aluno atualizado.");
  }else{
    const cred=createInternalStudentCredentials(nome);
    db.students.push({turma,chamada,nome,login:cred.login,senha:cred.senha});
    toast("Aluno cadastrado.");
  }

  S.cls=turma;
  persist();
  classStudentsPage();
}

function openStudentEditor(stt=null){
  const editor=byId("studentEditor");
  editor.classList.remove("hidden");
  byId("editLoginOriginal").value=stt?.login||"";
  byId("sc").value=stt?.chamada||"";
  byId("st").value=stt?.turma||S.cls;
  byId("sn").value=stt?.nome||"";
  byId("studentFormTitle").textContent=stt ? "Editar aluno" : "Cadastrar aluno";
  byId("studentSaveBtn").textContent=stt ? "Salvar alterações" : "Salvar aluno";
  byId("studentSaveBtn").onclick=saveStudent;
  byId("studentCancelBtn").onclick=()=>editor.classList.add("hidden");
  editor.scrollIntoView({behavior:"smooth",block:"start"});
}

function saveStudent(){
  const chamada=parseInt(byId("sc").value,10);
  const turma=byId("st").value;
  const nome=byId("sn").value.trim();
  const original=byId("editLoginOriginal").value;

  if(!chamada||chamada<1||!nome||!turma)
    return toast("Preencha nome, número de chamada e turma.");

  if(db.students.some(x=>x.turma===turma && Number(x.chamada)===chamada && x.login!==original))
    return toast("Esse número de chamada já está em uso nessa turma.");

  if(original){
    const idx=db.students.findIndex(x=>x.login===original);
    if(idx<0) return toast("Aluno não encontrado.");
    db.students[idx]={...db.students[idx],turma,chamada,nome};
    toast("Aluno atualizado.");
  }else{
    const cred=createInternalStudentCredentials(nome);
    db.students.push({turma,chamada,nome,login:cred.login,senha:cred.senha});
    toast("Aluno cadastrado.");
  }

  S.cls=turma;
  persist();
  studentsPage();
}

function editStudent(login){
  const stt=db.students.find(x=>x.login===login);
  if(!stt) return toast("Aluno não encontrado.");
  openStudentEditor(stt);
}

function removeStudent(login){
  const stt=db.students.find(x=>x.login===login);
  if(!stt) return toast("Aluno não encontrado.");
  if(!confirm(`Excluir ${stt.nome} da turma ${stt.turma}?`)) return;
  db.students=db.students.filter(x=>x.login!==login);
  persist();
  toast("Aluno excluído.");
  studentsPage();
}

function saveActivity(status){const x=collectDraftActivity();if(!validateActivityDraft(x))return;const now=Date.now();db.activities.unshift({id:now,...x,status,createdAt:now,publishedAt:status==='Publicada'?now:null,source:'professor-manual'});persist();S.sub=x.disciplina;if(x.turma!=='Todas as Turmas')S.cls=x.turma;toast(status==='Publicada'?'Atividade publicada e alunos notificados.':'Atividade salva como rascunho.');go('activityList')}

function deleteActivity(id){const a=db.activities.find(x=>x.id===id);if(!a)return;if(!confirm(`Excluir a atividade "${a.titulo}"?`))return;db.activities=db.activities.filter(x=>x.id!==id);db.activityResponses=db.activityResponses.filter(x=>String(x.activityId)!==String(id));Object.keys(db.activityViews).filter(k=>k.endsWith(':'+id)).forEach(k=>delete db.activityViews[k]);persist();activityList()}
function wordEscape(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function activityDownloadName(a,ext){const base=(String(a?.titulo||'atividade').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'atividade');return `${base}.${ext}`}
function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function mediaForExport(imageUrl,imageKey){if(imageKey){try{const blob=await getFileBlob(imageKey,true);if(blob)return await blobToDataUrl(blob)}catch(err){console.warn('Imagem local não disponível para exportação',err)}}if(imageUrl){try{const res=await fetch(imageUrl,{cache:'no-store'});if(res.ok)return await blobToDataUrl(await res.blob())}catch(err){console.warn('Não foi possível incorporar imagem remota',err)}return imageUrl}return ''}
async function buildExamExportHtml(a,{includeAnswerKey=true}={}){if(!a)return '';const qs=a.questions||[];let questionsHtml='';for(let i=0;i<qs.length;i++){const q=qs[i];const qImg=await mediaForExport(q.imageUrl,q.imageKey);let alts='';for(let j=0;j<(q.alternativas||[]).length;j++){const alt=q.alternativas[j];const altImg=await mediaForExport(alt.imageUrl,alt.imageKey);alts+=`<div class="exam-alt"><b>${String.fromCharCode(97+j)})</b> ${wordEscape(alt.texto||'')}${altImg?`<div><img src="${altImg}" class="exam-alt-img"></div>`:''}</div>`}

const answerKey=hasKey?`<section class="answer-key"><h2>GABARITO — USO DO PROFESSOR</h2>${qs.map((q,i)=>{const ix=(q.alternativas||[]).findIndex(x=>x.correta);const g=ix>=0?String.fromCharCode(65+ix)+') '+(q.alternativas[ix].texto||''):(q.resposta||'Correção manual');return `<p><b>${i+1}.</b> ${wordEscape(g)} — ${Number(q.valor||0).toFixed(1)} ponto(s)</p>`}).join('')}</section>`:'';
const turma=targetLabel(a)==='Todas as Turmas'?'9º Ano':wordEscape(targetLabel(a));
return `<!doctype html><html><head><meta charset="utf-8"><style>
@page{size:A4;margin:12mm}*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:"Times New Roman",serif;font-size:12pt;line-height:1.25}.exam-page{border:2px solid #111;min-height:270mm;padding:8px 10px 18px}.exam-head{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:start}.exam-logo{width:92px;height:92px;object-fit:contain}.school-lines{font-size:13pt}.school-lines b{font-weight:700}.student-line{margin:12px 0 8px;display:flex;align-items:flex-end;gap:8px}.student-fill{flex:1;border-bottom:1px solid #111;height:20px}.note-box{text-align:right;margin-left:auto;min-width:120px}.title{text-align:center;font-weight:700;font-size:14pt;margin:24px 0 22px}.component{width:52%;margin:0 auto 28px;border:2px solid #111;padding:7px 10px;text-align:center;font-weight:700;font-size:13pt}.orient{margin:0 0 10px}.exam-question{margin:10px 0 14px;page-break-inside:avoid}.exam-question p{margin:0 0 8px}.exam-qimg-wrap{text-align:center;margin:8px 0}.exam-qimg{max-width:520px;max-height:290px;object-fit:contain}.exam-alt{margin:6px 0 6px 24px}.exam-alt-img{max-width:280px;max-height:150px;object-fit:contain;margin:5px 0}.answer-lines div{border-bottom:1px solid #aaa;height:24px}.answer-key{page-break-before:always}.answer-key h2{text-align:center;font-size:14pt}.no-print-key{}.pdf-student .answer-key{display:none}

async function downloadActivityPdf(id,studentCopy=false){const a=db.activities.find(x=>String(x.id)===String(id));if(!a)return toast('Atividade não encontrada.');if(!window.html2pdf)return toast('Gerador de PDF não carregou. Verifique a internet.');try{toast('Preparando PDF...');const html=await buildExamExportHtml(a,{includeAnswerKey:!studentCopy});const host=document.createElement('div');host.style.position='fixed';host.style.left='-100000px';host.style.top='0';host.style.width='210mm';const style=html.match(/<style>([\s\S]*?)<\/style>/i)?.[1]||'';const body=html.match(/<body>([\s\S]*)<\/body>/i)?.[1]||html;host.innerHTML=`<style>${style}</style>${body}`;document.body.appendChild(host);await html2pdf().set({margin:0,filename:activityDownloadName(a,'pdf'),image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(host).save();host.remove()}catch(err){console.error(err);toast('Não foi possível gerar o PDF.')}}

function activityResults(){const a=db.activities.find(x=>String(x.id)===String(S.resultActivityId));if(!a)return go('activityList');const students=db.students.filter(st=>activityTargetsClass(a,st.turma));const rows=students.map(st=>{const r=getActivityResponse(st.login,a.id);if(!r)return `<tr><td>${e(st.nome)}</td><td>${e(st.turma)}</td><td><span class="badge statusPending">Não enviado</span></td><td>—</td><td>—</td><td>—</td><td></td></tr>`;const pending=(r.manualItems||[]).some(x=>x.notaManual==null);return `<tr><td>${e(st.nome)}</td><td>${e(st.turma)}</td><td><span class="badge ${pending?'statusPending':'statusDone'}">${pending?'Aguardando correção':'Corrigida'}</span></td><td>${Number(r.notaAutomatica||0).toFixed(1)}</td><td>${Number(r.notaManual||0).toFixed(1)}</td><td><b>${Number(r.notaFinal||0).toFixed(1)} / ${activityTotal(a).toFixed(1)}</b></td><td><button class="secondary miniAction" onclick="correctStudentActivity('${e(st.login)}',${a.id})">Corrigir/ver</button></td></tr>`}).join('');page.innerHTML=`<a class="back" href="#" onclick="go('activityList');return false">← Atividades</a><h1 class="center">Resultados da atividade</h1><p class="sub">${e(a.titulo)} • ${e(a.disciplina)} • Valor ${activityTotal(a).toFixed(1)}</p><div class="panel tableWrap"><table class="resultTable"><thead><tr><th>Aluno</th><th>Turma</th><th>Status</th><th>Automática</th><th>Manual</th><th>Nota final</th><th>Ação</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function correctStudentActivity(login,activityId){const a=db.activities.find(x=>x.id===activityId),r=getActivityResponse(login,activityId),st=db.students.find(x=>x.login===login);if(!a||!r||!st)return toast('Resposta não encontrada.');const answers=r.answers||{};const html=(a.questions||[]).map((q,i)=>{const ans=answers[q.id]??'';const manual=!(q.tipo==='Múltipla Escolha'||q.tipo==='Certo ou Errado');const item=(r.manualItems||[]).find(x=>x.questionId===q.id);return `<div class="question"><b>${i+1}. ${e(q.texto)} <span class="badge">${Number(q.valor||0).toFixed(1)} pt</span></b><div class="small muted" style="margin-top:7px">Resposta do aluno:</div><div style="padding:8px 0">${e(Array.isArray(ans)?ans.join(', '):ans||'—')}</div>${manual?`<label>Nota desta questão</label><input class="manualScoreInput manualGrade" data-qid="${e(q.id)}" type="number" min="0" max="${Number(q.valor||0)}" step="0.1" value="${item?.notaManual??''}"><div class="small muted">Máximo: ${Number(q.valor||0).toFixed(1)}</div>`:`<span class="badge green">Correção automática: ${Number((r.autoDetails||{})[q.id]||0).toFixed(1)} pt</span>`}</div>`}).join('');page.innerHTML=`<a class="back" href="#" onclick="activityResults();return false">← Resultados</a><h1 class="center">Correção</h1><p class="sub">${e(st.nome)} • ${e(st.turma)}</p><div class="panel">${html}<button class="primary" style="width:100%" onclick="saveManualGrades('${e(login)}',${activityId})">Salvar correção e nota final</button></div>`}
function saveManualGrades(login,activityId){const r=getActivityResponse(login,activityId),a=db.activities.find(x=>x.id===activityId);if(!r||!a)return;let manual=0;const items=[];document.querySelectorAll('.manualGrade').forEach(inp=>{const q=(a.questions||[]).find(x=>String(x.id)===String(inp.dataset.qid));if(!q)return;const v=Math.max(0,Math.min(Number(q.valor)||0,Number(inp.value)||0));manual+=v;items.push({questionId:q.id,notaManual:v})});r.manualItems=items;r.notaManual=Number(manual.toFixed(2));r.notaFinal=Number((Number(r.notaAutomatica||0)+manual).toFixed(2));r.correctedAt=Date.now();persist();toast('Correção salva.');activityResults()}

function openFileDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open("jc_files",1);req.onupgradeneeded=()=>{const idb=req.result;if(!idb.objectStoreNames.contains("files"))idb.createObjectStore("files")};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveFileBlobLocal(key,file){const idb=await openFileDB();return new Promise((resolve,reject)=>{const tx=idb.transaction("files","readwrite");tx.objectStore("files").put(file,key);tx.oncomplete=()=>{idb.close();resolve()};tx.onerror=()=>{idb.close();reject(tx.error)}})}
async function getFileBlobLocal(key){const idb=await openFileDB();return new Promise((resolve,reject)=>{const tx=idb.transaction("files","readonly");const req=tx.objectStore("files").get(key);req.onsuccess=()=>{idb.close();resolve(req.result)};req.onerror=()=>{idb.close();reject(req.error)}})}
function cloudFilePath(key){return String(key).split('/').map(encodeURIComponent).join('/')}
function safeExtension(name){const m=String(name||'').toLowerCase().match(/\.([a-z0-9]{1,8})$/);return m?'.'+m[1]:''}
function makeStorageKey(prefix,id,index,file){return `${prefix}/${id}/${index}-${Date.now()}-${Math.random().toString(36).slice(2,9)}${safeExtension(file?.name)}`}
function waitMs(ms){return new Promise(r=>setTimeout(r,ms))}
function uploadCloudFileXHR(key,file){
 return new Promise((resolve,reject)=>{
  const url=SUPABASE_URL+'/storage/v1/object/'+CLOUD_STORAGE_BUCKET+'/'+cloudFilePath(key);
  const xhr=new XMLHttpRequest();
  xhr.open('POST',url,true);
  xhr.timeout=300000; // até 5 minutos para PDFs no 4G/5G
  xhr.setRequestHeader('apikey',SUPABASE_KEY);
  xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
  xhr.setRequestHeader('x-upsert','true');
  xhr.setRequestHeader('Cache-Control','3600');
  xhr.setRequestHeader('Content-Type',file.type||(/\.pdf$/i.test(file.name||'')?'application/pdf':'application/octet-stream'));
  xhr.onload=()=>{
   if(xhr.status>=200&&xhr.status<300)return resolve(true);
   reject(new Error(`Storage ${xhr.status}: ${xhr.responseText||xhr.statusText}`));
  };
  xhr.onerror=()=>reject(new Error('Falha de rede durante o envio do arquivo.'));
  xhr.ontimeout=()=>reject(new Error('O envio demorou mais de 5 minutos. Verifique a conexão e tente novamente.'));
  xhr.onabort=()=>reject(new Error('Envio cancelado.'));
  xhr.send(file);
 });
}
function uploadCloudFileTus(key,file){
 return new Promise((resolve,reject)=>{
  if(!window.tus||!window.tus.Upload)return reject(new Error('Upload resumível indisponível.'));
  const objectName=key;
  const upload=new window.tus.Upload(file,{
   endpoint: SUPABASE_URL.replace('https://','https://')+'/storage/v1/upload/resumable',
   retryDelays:[0,1000,3000,5000,10000],
   chunkSize: 6*1024*1024,
   removeFingerprintOnSuccess:true,
   headers:{
    apikey:SUPABASE_KEY,
    Authorization:'Bearer '+SUPABASE_KEY,
    'x-upsert':'true'
   },
   metadata:{
    bucketName:CLOUD_STORAGE_BUCKET,
    objectName:objectName,
    contentType:file.type||(/\.pdf$/i.test(file.name||'')?'application/pdf':'application/octet-stream'),
    cacheControl:'3600'
   },
   onError:(err)=>reject(err instanceof Error?err:new Error(String(err||'Falha no upload resumível.'))),
   onSuccess:()=>resolve(true)
  });
  upload.findPreviousUploads().then(previous=>{
   if(previous&&previous.length)upload.resumeFromPreviousUpload(previous[0]);
   upload.start();
  }).catch(()=>upload.start());
 });
}
async function uploadCloudFile(key,file){
 let lastErr=null;
 const preferTus=(file?.size||0)>5*1024*1024;
 // PDFs/arquivos maiores usam upload resumível; arquivos menores usam XHR direto.
 if(preferTus){
  try{return await uploadCloudFileTus(key,file)}catch(err){lastErr=err;console.warn('Upload resumível falhou; tentando envio direto.',err)}
 }
 for(let attempt=1;attempt<=3;attempt++){
  try{return await uploadCloudFileXHR(key,file)}
  catch(err){lastErr=err;if(attempt<3)await waitMs(1200*attempt)}
 }
 // Se o envio direto falhar e o TUS estiver disponível, tenta uma última vez de forma resumível.
 if(!preferTus){
  try{return await uploadCloudFileTus(key,file)}catch(err){lastErr=err}
 }
 throw lastErr||new Error('Falha no envio do arquivo.');
}
async function downloadCloudFile(key){const r=await fetch(SUPABASE_URL+'/storage/v1/object/'+CLOUD_STORAGE_BUCKET+'/'+cloudFilePath(key),{headers:supabaseHeaders()});if(r.status===404)return null;if(!r.ok)throw new Error('Não foi possível baixar o arquivo do Supabase.');return await r.blob()}

async function saveFileBlob(key,file,requireCloud=true){try{if(!navigator.onLine)throw new Error('Sem conexão com a internet.');await uploadCloudFile(key,file);cloudLastError="";updateCloudIndicators();try{await saveFileBlobLocal(key,file)}catch(localErr){console.warn('Não foi possível manter a cópia local do arquivo.',localErr)}return true}catch(err){cloudLastError=err.message;updateCloudIndicators();console.warn('Falha no envio do arquivo ao Supabase.',err);try{await saveFileBlobLocal(key,file)}catch{}if(requireCloud)throw err;return false}}
async function getFileBlob(key,preferRemote=false){if(preferRemote){try{const remote=await downloadCloudFile(key);if(remote){try{await saveFileBlobLocal(key,remote)}catch{}return remote}}catch(err){console.warn(err)}}try{const local=await getFileBlobLocal(key);if(local)return local}catch{}try{const remote=await downloadCloudFile(key);if(remote){try{await saveFileBlobLocal(key,remote)}catch{}return remote}}catch(err){console.warn(err)}return null}

function subjects(){page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Início</a><h1 class="center">${e(S.user.turma)}</h1><p class="sub">Escolha uma disciplina</p><div class="grid2">${SUBJECTS.map(s=>`<article class="card click" onclick="S.sub='${s}';go('subjectPage')"><div class="tile">${s==="Matemática"?"📐":"🧪"}</div><h3>${s}</h3><p>Arquivos, links e textos publicados pelo professor.</p></article>`).join("")}</div>`}
function subjectPage(){const arr=db.contents.filter(c=>c.turma===S.user.turma&&c.disciplina===S.sub);page.innerHTML=`<a class="back" href="#" onclick="go('subjects');return false">← Disciplinas</a><h1 class="center">${e(S.sub)}</h1><p class="sub">${e(S.user.turma)}</p><div class="list">${arr.map(x=>`<div class="row"><div class="grow"><b>${e(x.desc||"Conteúdo")}</b><span class="small muted">${x.type==="file"?e((x.files||[]).map(f=>f.name).join(", ")):x.type==="link"?e(x.link):e(x.text)}</span></div>${x.type==="file"?`<div class="downloadActions">${(x.files||[]).map((f,i)=>`<button class="secondary" onclick="openContentFile(${x.id},${i})" title="Visualizar ${e(f.name)}">👁 Visualizar</button><button class="downloadBtn" onclick="downloadContentFile(${x.id},${i})" title="Baixar ${e(f.name)}">⬇ Download</button>`).join("")}</div>`:x.type==="link"?`<button class="secondary" onclick="window.open('${e(x.link)}','_blank')">Abrir</button>`:""}</div>`).join("")||'<div class="empty">Nenhum conteúdo publicado ainda.</div>'}</div>`}
function studentActs(){const arr=db.activities.filter(a=>activityTargetsClass(a,S.user.turma)&&a.disciplina===S.sub&&a.status==='Publicada');page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Início</a><h1 class="center">Atividades e Questionários</h1><p class="sub">Escolha uma disciplina para ver as atividades da sua turma.</p><div class="tabs">${SUBJECTS.map(s=>{const n=studentUnreadActivityCount(S.user.login,s);return `<button class="${s===S.sub?'active':''}" onclick="S.sub='${s}';studentActs()">${s}${n?` <span class="unreadDot">${n}</span>`:''}</button>`}).join('')}</div><div class="panel"><span class="small muted">Disciplina selecionada</span><b style="display:block;font-size:20px;margin-top:4px">${e(S.sub)}</b></div><div class="list">${arr.map(a=>{const fresh=!db.activityViews[activityViewKey(S.user.login,a.id)],resp=getActivityResponse(S.user.login,a.id);return `<div class="row"><div class="grow"><span class="badge green">PUBLICADA</span>${fresh?'<span class="unreadDot">NOVA</span>':''}${resp?'<span class="badge">RESPONDIDA</span>':''}<b style="margin-top:6px">${e(a.titulo)}</b><span class="small muted">${e(a.disciplina)} • ${a.questions?.length||0} questões • Valor ${activityTotal(a).toFixed(1)} • Prazo: ${a.prazo?new Date(a.prazo).toLocaleString('pt-BR'):'Sem prazo'}</span>${resp?`<span class="small"><b>Nota atual: ${Number(resp.notaFinal||0).toFixed(1)} / ${activityTotal(a).toFixed(1)}</b>${(resp.manualItems||[]).some(x=>x.notaManual==null)?' • aguardando correção discursiva':''}</span>`:''}</div><div class="toolrow"><button class="secondary" onclick="downloadActivityPdf(${a.id},true)">📄 PDF</button><button class="primary" onclick="openActivity(${a.id})">${resp?'Ver':'Começar'}</button></div></div>`}).join('')||'<div class="empty">Nenhuma atividade disponível nesta disciplina.</div>'}</div>`}
function openActivity(id){S.activityId=id;S.page='studentActivity';saveSessionState();studentActivity()}
function studentActivity(){const id=S.activityId;const a=db.activities.find(x=>x.id===id);if(!a){S.page='studentActs';return studentActs()}markActivityViewed(id);const prior=getActivityResponse(S.user.login,id);const qs=(a.questions||[]).map((q,i)=>{const answer=prior?.answers?.[q.id]??'';const qimg=mediaPreviewHtml(q.imageUrl,q.imageKey,'activityQuestionImage');let body='';if(q.tipo==='Múltipla Escolha'||q.tipo==='Certo ou Errado'){body=(q.alternativas||[]).map((alt,j)=>`<label class="studentAlternative"><input type="radio" name="ans_${e(q.id)}" value="${e(alt.id||String(j))}" ${String(answer)===String(alt.id||j)?'checked':''} ${prior?'disabled':''}><div><b>${String.fromCharCode(65+j)})</b> ${formulaTextHtml(alt.texto||'')}${mediaPreviewHtml(alt.imageUrl,alt.imageKey,'')}</div></label>`).join('')}else if(q.tipo==='Resposta Curta'){body=`<div class="studentFormulaRow"><input class="studentAnswer" data-qid="${e(q.id)}" value="${e(answer)}" ${prior?'disabled':''} placeholder="Digite sua resposta"><button type="button" class="formulaBtn" ${prior?'disabled':''} onclick="openFormulaEditor(this.previousElementSibling)">ƒx</button></div>`}else{body=`<div class="studentFormulaRow"><textarea class="studentAnswer" data-qid="${e(q.id)}" ${prior?'disabled':''} placeholder="Digite sua resposta">${e(answer)}</textarea><button type="button" class="formulaBtn" ${prior?'disabled':''} onclick="openFormulaEditor(this.previousElementSibling)">ƒx</button></div>`}return `<div class="activityStudentQuestion" data-qid="${e(q.id)}"><b>${i+1}. ${formulaTextHtml(q.texto)} <span class="badge">${Number(q.valor||0).toFixed(1)} pt</span></b>${qimg}${body}</div>`}).join('');page.innerHTML=`<a class="back" href="#" onclick="go('studentActs');return false">← Atividades</a><div class="toolrow" style="justify-content:space-between;align-items:center"><span class="badge green">PUBLICADA</span><button class="secondary" onclick="downloadActivityPdf(${a.id},true)">📄 Baixar prova em PDF</button></div><h1>${e(a.titulo)}</h1><p class="muted">${e(S.user.turma)} • ${e(a.disciplina)}</p><div class="notice">${e(a.orientacoes||'Leia as questões com atenção.')}</div><div class="statgrid"><div class="stat"><b>${a.questions?.length||0}</b>Questões</div><div class="stat"><b>${activityTotal(a).toFixed(1)}</b>Valor total</div><div class="stat"><b>⏱</b>${a.prazo?new Date(a.prazo).toLocaleDateString('pt-BR'):'Sem prazo'}</div></div><div class="panel">${qs||'<div class="empty">Atividade sem perguntas cadastradas.</div>'}${prior?`<div class="notice"><b>Atividade enviada.</b><br>Nota automática: ${Number(prior.notaAutomatica||0).toFixed(1)} • Nota atual: ${Number(prior.notaFinal||0).toFixed(1)} / ${activityTotal(a).toFixed(1)}</div>`:`<button class="primary" style="width:100%" onclick="submitActivityAnswers(${a.id})">Enviar respostas</button>`}</div>`;setTimeout(()=>{hydrateActivityImages(page);typesetMath(page)},0)}
function submitActivityAnswers(activityId){const a=db.activities.find(x=>x.id===activityId);if(!a)return;if(getActivityResponse(S.user.login,activityId))return toast('Esta atividade já foi enviada.');const answers={},autoDetails={};let automatic=0;const manualItems=[];for(const q of (a.questions||[])){let ans='';if(q.tipo==='Múltipla Escolha'||q.tipo==='Certo ou Errado'){const picked=document.querySelector(`input[name="ans_${CSS.escape(String(q.id))}"]:checked`);if(!picked)return toast('Responda todas as questões antes de enviar.');ans=picked.value;const correct=(q.alternativas||[]).findIndex(x=>x.correta);const selected=(q.alternativas||[]).findIndex((x,i)=>String(x.id||i)===String(ans));const score=selected===correct?(Number(q.valor)||0):0;automatic+=score;autoDetails[q.id]=score}else{const el=document.querySelector(`.studentAnswer[data-qid="${CSS.escape(String(q.id))}"]`);ans=el?.value.trim()||'';if(!ans)return toast('Responda todas as questões antes de enviar.');manualItems.push({questionId:q.id,notaManual:null})}answers[q.id]=ans}const now=Date.now();const r={id:now,activityId:a.id,login:S.user.login,nome:S.user.nome,turma:S.user.turma,answers,autoDetails,notaAutomatica:Number(automatic.toFixed(2)),notaManual:0,notaFinal:Number(automatic.toFixed(2)),manualItems,submittedAt:now};db.activityResponses.unshift(r);persist();toast(manualItems.length?'Respostas enviadas. A parte objetiva foi corrigida automaticamente.':'Respostas enviadas e corrigidas automaticamente.');openActivity(activityId)}
function send(){page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Início</a><h1 class="center">Enviar atividade</h1><p class="sub">${e(S.user.turma)}</p><div class="notice">🔒 Somente o professor poderá abrir este arquivo e ler as observações.</div><div class="panel"><label>Disciplina</label><select id="sd">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select><label>Arquivo ou foto</label><input id="sf" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"><p class="small muted">Até 15 MB.</p><label>Observações (opcional)</label><textarea id="so"></textarea><button class="primary" style="width:100%" onclick="sendWork()">Enviar ao professor</button></div>`}
async function sendWork(){const f=sf.files[0];if(!f)return toast("Selecione um arquivo.");if(f.size>15*1024*1024)return toast("O arquivo ultrapassa 15 MB.");const id=Date.now(),storageKey=makeStorageKey('atividades',id,0,f);try{await saveFileBlob(storageKey,f,true)}catch(err){console.error(err);return toast("Não foi possível armazenar o arquivo enviado.")}db.submissions.unshift({id,nome:S.user.nome,login:S.user.login,turma:S.user.turma,disciplina:sd.value,file:f.name,fileType:f.type,fileSize:f.size,storageKey,obs:so.value});persist();await syncNow(false);toast("Atividade enviada ao professor.")}
function studentTalk(){const now=Date.now();db.messages.forEach(m=>{if(m.login===S.user.login&&m.from==='teacher'&&!m.readStudent){m.readStudent=true;m.readAtStudent=now}});persist();const hist=db.messages.filter(x=>x.login===S.user.login);page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Início</a><h1 class="center">Professor Junio C.</h1><p class="sub">Conversa privada</p><div class="chatToolbar"><span class="autoDeleteInfo">🕒 Mensagens lidas são removidas após ${MESSAGE_RETENTION_DAYS} dias.</span><button class="danger" onclick="deleteConversation('${e(S.user.login)}','student')">🗑 Excluir conversa</button></div><div class="chatPanel"><div id="chat" class="chatHistory">${hist.map(m=>`<div class="chatBubble ${m.from==='student'?'mine':'theirs'}"><b>${m.from==='teacher'?'Professor':'Você'}</b><div>${e(m.text||'')}</div>${m.fileName?`<div class="small muted">📎 ${e(m.fileName)}</div>`:''}<span class="chatDate">${e(m.date||'')}</span><div class="messageActions"><button class="messageDelete" onclick="deleteMessage(${m.id},'studentTalk')">🗑 Excluir</button></div></div>`).join('')||'<div class="empty">Nenhuma mensagem ainda.</div>'}</div><label>Mensagem</label><textarea id="studentMsg" placeholder="Digite sua mensagem..."></textarea><label>Adicionar mídia</label><input id="studentMedia" type="file" accept="image/*,.pdf,audio/*,video/*"><p class="small muted">Imagem, PDF, áudio ou vídeo — até 10 MB.</p><button class="primary" style="width:100%" onclick="sendStudentMessage()">Enviar mensagem</button></div>`;setTimeout(()=>{const c=byId('chat');if(c)c.scrollTop=c.scrollHeight},0)}
function sendStudentMessage(){const t=byId('studentMsg'),f=byId('studentMedia')?.files?.[0];const text=t?.value.trim()||'';if(!text&&!f)return toast('Digite uma mensagem ou escolha um arquivo.');if(f&&f.size>10*1024*1024)return toast('O arquivo ultrapassa 10 MB.');const now=Date.now();db.messages.push({id:now,createdAt:now,login:S.user.login,from:'student',text,fileName:f?.name||'',date:new Date(now).toLocaleString('pt-BR'),readTeacher:false,readStudent:true,readAtTeacher:null,readAtStudent:now});persist();studentTalk()}
window.addEventListener('storage',ev=>{if(ev.key==='jc_messages'){try{db.messages=JSON.parse(ev.newValue||'[]')}catch{}if(S.user&&(S.page==='messages'||S.page==='teacherTalk'||S.page==='studentTalk'))render()}});
initCloud().finally(()=>{if(!preserveActiveInteraction())render();else updateCloudIndicators()});
</script></body></html>
