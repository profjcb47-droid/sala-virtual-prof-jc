*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--texto)}
body:before{content:"π   ∑   √x   x²+y²   Δ=b²−4ac   ∫f(x)dx   a²+b²=c²";position:fixed;inset:0;pointer-events:none;white-space:pre-wrap;word-spacing:60px;line-height:150px;font:28px Georgia;color:rgba(11,112,224,.035);overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.header{max-width:920px;margin:0 auto 18px;background:#fff;border:1px solid #eef1f5;border-radius:0 0 20px 20px;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 8px 24px rgba(0,0,0,.07);position:sticky;top:0;z-index:5}
.head-left{display:flex;gap:10px}.head-btn{border:1px solid #bdd3ec;background:#fff;color:#0757b6;border-radius:10px;width:40px;height:40px;font-size:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px}.brand img{width:56px;height:56px;object-fit:contain;border-radius:50%}
.page{max-width:920px;margin:0 auto 60px;padding:0 14px}h1{text-align:center;font-size:34px;margin:8px 0 4px}.sub{text-align:center;color:var(--muted);margin-bottom:20px}.back{display:inline-block;background:#fff;border:1px solid #e5eaf0;padding:9px 12px;border-radius:10px;font-weight:800;color:#17466f;text-decoration:none;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--linha);border-radius:18px;padding:17px;box-shadow:0 8px 22px rgba(0,0,0,.06);position:relative;overflow:hidden}.card:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#0b70e0 0 25%,#2ab66f 25% 50%,#f1bd29 50% 75%,#e95056 75%)}
.card h3{margin:10px 0 7px}.card p{color:#5f6b7a;font-size:13px;line-height:1.4}.icon{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(#1889ff,#075fd0);color:#fff;font-size:24px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.17)}
.panel{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 20px rgba(0,0,0,.05)}label{display:block;font-size:12px;font-weight:800;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:#fff}textarea{resize:vertical}.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.primary{width:100%;border:0;border-radius:10px;padding:12px;background:linear-gradient(#1684ff,#075fce);color:#fff;font-weight:900;box-shadow:inset 0 -4px 0 #064b9f}.secondary{border:1px solid #cbd5e1;background:#fff;color:#0757b6;border-radius:9px;padding:9px 12px;font-weight:800}.danger{border:1px solid #f2a3a3;background:#fff7f7;color:#bb2020;border-radius:9px;padding:8px 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}.tabs button{border:1px solid #cbd5e1;background:#fff;color:#0757b6;padding:8px 12px;border-radius:999px;font-weight:800}.tabs button.active{background:#0b70e0;color:#fff;border-color:#0b70e0}
.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--linha);border-radius:13px;padding:12px}.muted{color:var(--muted)}.badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#e9f3ff;color:#0757b6}.ok{background:#eaf8ef;color:#16713f}.empty{border:1px dashed #cbd5e1;border-radius:13px;padding:22px;text-align:center;color:#7b8795}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(500px,100%);background:#fff;border:1px solid var(--linha);border-radius:28px;padding:25px 30px 30px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.14)}.login img{width:180px;height:180px;object-fit:contain}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.roles button{padding:11px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;font-weight:900;color:#667085}.roles button.active{background:#0b70e0;color:#fff}.links{display:flex;flex-direction:column;gap:9px;margin-top:14px;font-size:13px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}.drawer.open{display:block}.drawer-panel{width:min(280px,90%);height:100%;background:#fff;padding:18px}.drawer-panel img{width:110px;height:110px;object-fit:contain;display:block;margin:auto}.drawer-panel b{display:block;text-align:center;margin:8px 0 14px}.drawer-panel a{display:block;padding:11px;border-bottom:1px solid #edf0f4;text-decoration:none;color:#14213d;font-weight:800;font-size:13px}

table{border-collapse:collapse;width:100%;min-width:720px}th,td{border-bottom:1px solid #e8edf2;padding:8px;text-align:left;vertical-align:top}th{font-size:11px;color:#677386;text-transform:uppercase}.scroll{overflow:auto}

<div class="scroll panel"><table><thead><tr><th>Horário</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${slots.map((i)=>{
 let sk=cls+"|slot|"+i,st=S.schedule[sk]||{start:["08:00","10:00","13:00","15:00","17:00","19:00"][i],end:["10:00","12:00","15:00","17:00","19:00","21:00"][i]};
 let timeCell=S.user.role==="teacher"?`<div class="time-row"><b>${i+1}ª aula</b><input type="time" value="${st.start}" onchange="setSlot('${cls}',${i},'start',this.value)"><input type="time" value="${st.end}" onchange="setSlot('${cls}',${i},'end',this.value)"></div>`:`<b>${st.start}–${st.end}</b>`;
 return `<tr><td>${timeCell}</td>${days.map(d=>{let k=cls+"|"+d+"|"+i,v=S.schedule[k]||"—";return `<td>${S.user.role==="teacher"?`<select onchange="S.schedule['${k}']=this.value;save()"><option ${v==='—'?'selected':''}>—</option><option ${v==='Matemática'?'selected':''}>Matemática</option><option ${v==='Ciências'?'selected':''}>Ciências</option></select>`:esc(v)}</td>`}).join("")}</tr>`}).join("")}</tbody></table></div>`;
}
function setSlot(cls,i,part,val){let k=cls+"|slot|"+i,v=S.schedule[k]||{start:"08:00",end:"10:00"};v[part]=val;S.schedule[k]=v;save();toast("Horário atualizado")}
function student(){page.innerHTML=`<div class="student-head"><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${esc(S.user.nome[0])}</div><div><b>Olá, ${esc(S.user.nome.split(" ")[0])}!</b><div class="muted">${S.user.turma}</div></div></div></div><h1>Sua turma</h1><p class="sub">Acesse somente os conteúdos da sua turma.</p><div class="grid">${[["🎓",S.user.turma,"Disciplinas e conteúdos.","subjects"],["🧠","Atividades e Questionários","Responda às atividades publicadas.","studentActs"],["📤","Enviar atividades/trabalhos","Envie arquivos ao professor.","send"],["🗓️","Horário escolar","Consulte os horários editados pelo professor.","schedule"],["💬","Falar com o professor","Mensagem privada.","studentTalk"]].map(x=>`<div class="card" onclick="setPage('${x[3]}')"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div>`}
function subjects(){page.innerHTML=`<a class="back" href="#" onclick="setPage('student');return false">← Início</a><h1>${S.user.turma}</h1><p class="sub">Escolha uma disciplina</p><div class="grid two">${SUBJECTS.map(s=>`<div class="card" onclick="S.sub='${s}';setPage('subjectPage')"><div class="icon">${s==='Matemática'?'📚':'🧪'}</div><h3>${s}</h3><p>Arquivos, links, textos e conteúdo de prova.</p></div>`).join("")}</div>`}
function subjectPage(){let arr=S.contents.filter(c=>c.turma===S.user.turma&&c.disciplina===S.sub);page.innerHTML=`<a class="back" href="#" onclick="setPage('subjects');return false">← ${S.user.turma}</a><h1>${S.sub}</h1><div class="list">${arr.map(c=>`<div class="item"><div><b>${esc(c.desc||c.file||c.link||'Conteúdo')}</b><div class="muted">${esc(c.text||c.link||c.file||'')}</div></div></div>`).join("")||'<div class="empty">Nenhum conteúdo publicado ainda.</div>'}</div>`}
function studentActs(){let arr=S.activities.filter(a=>a.turma===S.user.turma&&a.disciplina===S.sub);page.innerHTML=`<a class="back" href="#" onclick="setPage('student');return false">← Início</a><h1>Atividades e Questionários</h1><div class="tabs">${SUBJECTS.map(s=>`<button class="${S.sub===s?'active':''}" onclick="S.sub='${s}';studentActs()">${s}</button>`).join("")}</div><div class="list">${arr.map(a=>`<div class="item"><div><span class="badge ok">PUBLICADA</span><h3>${esc(a.titulo)}</h3><div class="muted">Prazo: ${a.prazo||'—'}</div></div><button class="secondary" onclick="toast('Atividade aberta')">Começar</button></div>`).join("")||'<div class="empty">Nenhuma atividade disponível.</div>'}</div>`}
function send(){page.innerHTML=`<a class="back" href="#" onclick="setPage('student');return false">← Início</a><h1>Enviar atividades/trabalhos</h1><p class="sub">${S.user.turma}</p><div class="panel"><label>Disciplina</label><select id="sd"><option>Matemática</option><option>Ciências</option></select><label>Arquivo ou foto</label><input id="sf" type="file"><label>Observações</label><textarea id="so" rows="4"></textarea><button class="primary" onclick="if(!sf.files[0])return toast('Selecione um arquivo');S.submissions.push({nome:S.user.nome,login:S.user.login,turma:S.user.turma,disciplina:sd.value,file:sf.files[0].name,obs:so.value});save();toast('Atividade enviada ao professor')">Enviar ao professor</button></div>`}
function studentTalk(){page.innerHTML=`<a class="back" href="#" onclick="setPage('student');return false">← Início</a><h1>Falar com o professor</h1><div class="card"><div class="icon">🧑‍🏫</div><h3>Professor Junio C.</h3><p>Conversa privada com o professor.</p><label>Mensagem</label><textarea id="mt" rows="5"></textarea><button class="primary" onclick="S.messages.push({login:S.user.login,text:mt.value,date:new Date().toLocaleString('pt-BR')});save();mt.value='';toast('Mensagem enviada')">Enviar mensagem</button></div>`}
render();
</script>
</body>
</html>
