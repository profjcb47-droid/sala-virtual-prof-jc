<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b70df">
<title>Sala Virtual Prof. JC</title>
<style>
:root{--blue:#0876e8;--blue2:#075cb6;--ink:#11213b;--muted:#687586;--line:#dbe3ec;--paper:#fbfaf7;--green:#189e5a;--shadow:0 12px 30px rgba(16,33,59,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
button{cursor:pointer}.app{min-height:100vh}.page{width:min(930px,calc(100% - 24px));margin:0 auto 56px}.center{text-align:center}.muted{color:var(--muted)}h1{font-size:34px;line-height:1.08;margin:10px 0 6px}.sub{margin:0 0 22px;text-align:center;color:var(--muted)}
.top{width:min(930px,calc(100% - 24px));height:66px;margin:0 auto 16px;background:#fff;border:1px solid #edf1f5;border-radius:0 0 20px 20px;box-shadow:0 7px 20px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.top-left{display:flex;gap:9px}.iconbtn{width:40px;height:40px;border:1px solid #bad1e9;border-radius:10px;background:#fff;color:#075ca6;font-size:21px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:13px}.brand img{width:48px;height:48px;border-radius:50%;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;min-height:190px;padding:17px;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.045);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.card:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#1688ea 0 25%,#2dac6c 25% 50%,#efc13d 50% 75%,#e65059 75%)}
.card.click{cursor:pointer}.card h3{font-size:19px;line-height:1.04;margin:11px 0 10px}.card p{font-size:13px;line-height:1.45;color:#5f6c7d;margin:0}
@media (hover:hover) and (pointer:fine){.card.click:hover{transform:translateY(-9px) scale(1.018);box-shadow:0 20px 38px rgba(15,55,96,.18);border-color:#bcd8f5}.card.click:hover .tile{transform:rotate(-4deg) scale(1.08)}}
.card.click:active{transform:translateY(-2px) scale(.99)}.tile{width:48px;height:48px;border-radius:13px;background:linear-gradient(#1590fb,#0365c8);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);display:grid;place-items:center;color:#fff;font-size:25px;transition:transform .22s ease}
.back{display:inline-flex;align-items:center;gap:5px;color:#1d527c;background:#fff;border:1px solid #dfe6ee;border-radius:10px;padding:9px 12px;text-decoration:none;font-weight:800;font-size:13px;margin-bottom:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 7px 18px rgba(0,0,0,.045)}.panel h3{margin-top:0}
label{display:block;font-size:12px;font-weight:900;margin:10px 0 6px}input,select,textarea{width:100%;min-height:42px;border:1px solid #cbd5df;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);font-size:16px}textarea{min-height:100px;resize:vertical}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.primary,.secondary,.danger{min-height:44px;border-radius:10px;padding:10px 14px;font-weight:900}.primary{border:0;background:linear-gradient(#178cff,#0564c8);box-shadow:inset 0 -4px 0 #064e9b;color:white}.secondary{border:1px solid #cbd5df;background:#fff;color:#0866bf}.danger{border:1px solid #efb3b3;background:#fff7f7;color:#b42a2a}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:13px 0}.tabs button{border:1px solid #c8d5e1;background:#fff;color:#075da8;border-radius:999px;padding:8px 12px;font-weight:800}.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.list{display:flex;flex-direction:column;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.row .grow{min-width:0;flex:1}.row b{display:block}.small{font-size:12px}.badge{display:inline-block;font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eaf4ff;color:#0864b9}.badge.green{background:#eaf8f0;color:#167641}.empty{padding:24px;text-align:center;border:1px dashed #c9d4df;border-radius:13px;color:#748091;background:#fff}
.notice{padding:14px;border:1px solid #92d6ad;border-radius:14px;background:#f0fbf4;color:#195f37;margin:13px 0}
.modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.modebar button{border:1px solid #c8d5e1;background:#fff;color:#174b74;border-radius:11px;padding:12px;font-weight:900}.modebar button.active{background:#edf6ff;border-color:#7ab8ef;color:#075fae;box-shadow:inset 0 0 0 1px #9fcaf0}
.sectionTitle{font-size:20px;margin:24px 0 10px}.miniTabs{display:flex;gap:18px;border-bottom:1px solid #dce4ec;margin-bottom:12px}.miniTabs button{border:0;background:none;padding:10px 3px;font-weight:900;color:#6d7785;border-bottom:3px solid transparent}.miniTabs button.active{color:#0870cf;border-bottom-color:#0870cf}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:none}.drawer.open{display:block}.drawerbox{width:min(300px,88vw);height:100%;background:#fff;padding:16px;box-shadow:10px 0 30px rgba(0,0,0,.15)}.drawerbox img{width:100px;height:100px;object-fit:contain;border-radius:50%;display:block;margin:0 auto}.drawerbox h3{text-align:center;margin:6px 0 16px}.drawerbox a{display:block;text-decoration:none;color:#18334d;font-weight:800;font-size:13px;padding:11px 9px;border-bottom:1px solid #edf1f4}.drawerbox a:hover{background:#f2f7fb}

function access(){const list=db.students.filter(s=>s.turma===S.cls);page.innerHTML=`<a class="back" href="#" onclick="go('teacher');return false">← Área do professor</a><h1 class="center">Quando o aluno entrou no app</h1><div class="tabs">${CLASSES.map(c=>`<button class="${c===S.cls?"active":""}" onclick="S.cls='${c}';access()">${c}</button>`).join("")}</div><div class="list">${list.map(st=>`<div class="row"><b>${e(st.nome)}</b><span class="${db.accesses[st.login]?"badge green":"small muted"}">${db.accesses[st.login]?e(db.accesses[st.login]):"Sem acesso"}</span></div>`).join("")}</div>`}
function student(){page.innerHTML=`<div class="panel avatarline"><div class="avatar">${e(S.user.nome[0])}</div><div><b>Olá, ${e(S.user.nome.split(" ")[0])}!</b><div class="small muted">${e(S.user.turma)} • acesso exclusivo</div></div></div><div class="notice"><b>Atividades recebidas</b><br><span class="small">Confira as atividades e materiais publicados pelo professor.</span></div><h1 class="center">Sua turma</h1><p class="sub">Você pode acessar somente os conteúdos da sua turma.</p><div class="grid">${[["🎓",S.user.turma,"Acesse Matemática e Ciências.","subjects"],["🧠","Atividades e Questionários","Responda às atividades publicadas.","studentActs"],["📤","Enviar atividades/trabalhos","Envie arquivos ao professor.","send"],["🗓️","Horário escolar","Veja os horários da sua turma.","schedule"],["💬","Falar com o professor","Conversa privada com o Prof. JC.","studentTalk"]].map(x=>`<article class="card click" onclick="go('${x[3]}')"><div class="tile">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join("")}</div>`}
function subjects(){page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Início</a><h1 class="center">${e(S.user.turma)}</h1><p class="sub">Escolha uma disciplina</p><div class="grid2">${SUBJECTS.map(s=>`<article class="card click" onclick="S.sub='${s}';go('subjectPage')"><div class="tile">${s==="Matemática"?"📐":"🧪"}</div><h3>${s}</h3><p>Arquivos, links e textos publicados pelo professor.</p></article>`).join("")}</div>`}
function subjectPage(){const arr=db.contents.filter(c=>c.turma===S.user.turma&&c.disciplina===S.sub);page.innerHTML=`<a class="back" href="#" onclick="go('subjects');return false">← Disciplinas</a><h1 class="center">${e(S.sub)}</h1><p class="sub">${e(S.user.turma)}</p><div class="list">${arr.map(x=>`<div class="row"><div class="grow"><b>${e(x.desc||"Conteúdo")}</b><span class="small muted">${x.type==="file"?e((x.files||[]).map(f=>f.name).join(", ")):x.type==="link"?e(x.link):e(x.text)}</span></div>${x.type==="link"?`<button class="secondary" onclick="window.open('${e(x.link)}','_blank')">Abrir</button>`:""}</div>`).join("")||'<div class="empty">Nenhum conteúdo publicado ainda.</div>'}</div>`}
function studentActs(){const arr=db.activities.filter(a=>a.turma===S.user.turma&&a.disciplina===S.sub&&a.status==="Publicada");page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Início</a><h1 class="center">Atividades e Questionários</h1><div class="tabs">${SUBJECTS.map(s=>`<button class="${s===S.sub?"active":""}" onclick="S.sub='${s}';studentActs()">${s}</button>`).join("")}</div><div class="list">${arr.map(a=>`<div class="row"><div class="grow"><span class="badge green">PUBLICADA</span><b style="margin-top:5px">${e(a.titulo)}</b><span class="small muted">${a.questions?.length||0} questões • Prazo: ${a.prazo?new Date(a.prazo).toLocaleString("pt-BR"):"—"}</span></div><button class="primary" onclick="openActivity(${a.id})">Começar</button></div>`).join("")||'<div class="empty">Nenhuma atividade disponível nesta disciplina.</div>'}</div>`}
function openActivity(id){const a=db.activities.find(x=>x.id===id);if(!a)return;page.innerHTML=`<a class="back" href="#" onclick="studentActs();return false">← Atividades</a><span class="badge green">PUBLICADA</span><h1>${e(a.titulo)}</h1><p class="muted">${e(a.turma)} • ${e(a.disciplina)}</p><div class="notice">${e(a.orientacoes||"Leia as questões com atenção.")}</div><div class="statgrid"><div class="stat"><b>${a.questions?.length||0}</b>Questões</div><div class="stat"><b>${a.tentativas||1}</b>Tentativas</div><div class="stat"><b>⏱</b>${a.prazo?new Date(a.prazo).toLocaleDateString("pt-BR"):"Sem prazo"}</div></div><div class="panel">${(a.questions||[]).map((q,i)=>`<div class="question"><b>${i+1}. ${e(q.texto)}</b><label>Sua resposta</label><textarea></textarea></div>`).join("")||'<div class="empty">Atividade sem perguntas cadastradas.</div>'}<button class="primary" style="width:100%" onclick="toast('Respostas enviadas ao professor.')">Enviar respostas</button></div>`}
function send(){page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Início</a><h1 class="center">Enviar atividade</h1><p class="sub">${e(S.user.turma)}</p><div class="notice">🔒 Somente o professor poderá abrir este arquivo e ler as observações.</div><div class="panel"><label>Disciplina</label><select id="sd">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select><label>Arquivo ou foto</label><input id="sf" type="file"><p class="small muted">Até 15 MB.</p><label>Observações (opcional)</label><textarea id="so"></textarea><button class="primary" style="width:100%" onclick="sendWork()">Enviar ao professor</button></div>`}
function sendWork(){const f=sf.files[0];if(!f)return toast("Selecione um arquivo.");if(f.size>15*1024*1024)return toast("O arquivo ultrapassa 15 MB.");db.submissions.unshift({id:Date.now(),nome:S.user.nome,login:S.user.login,turma:S.user.turma,disciplina:sd.value,file:f.name,obs:so.value});persist();toast("Atividade enviada ao professor.")}
function studentTalk(){page.innerHTML=`<a class="back" href="#" onclick="go('student');return false">← Conversas</a><h1 class="center">Professor Junio C.</h1><p class="sub">Conversa privada</p><div class="panel"><div id="chat">${db.messages.filter(x=>x.login===S.user.login).map(m=>`<div class="question"><b>${m.from==="teacher"?"Professor":"Você"}</b><div>${e(m.text)}</div><span class="small muted">${e(m.date||"")}</span></div>`).join("")||'<div class="empty">Nenhuma mensagem ainda.</div>'}</div><label>Mensagem</label><textarea id="msg"></textarea><label>Adicionar mídia</label><input type="file" accept="image/*,.pdf,audio/*,video/*"><p class="small muted">Imagem, PDF, áudio ou vídeo — até 10 MB.</p><button class="primary" style="width:100%" onclick="if(!msg.value.trim())return toast('Digite uma mensagem.');db.messages.push({login:S.user.login,from:'student',text:msg.value.trim(),date:new Date().toLocaleString('pt-BR')});persist();studentTalk()">Enviar mensagem</button></div>`}
render();
</script></body></html>
