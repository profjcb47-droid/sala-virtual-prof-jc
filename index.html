<style>
:root{
  --primary:#1558a6; --primary2:#0b3d78; --accent:#f2b900; --bg:#f5f7fb;
  --card:#fff; --text:#172033; --muted:#64748b; --line:#dfe5ee;
  --success:#168a55; --danger:#c43b3b; --shadow:0 8px 24px rgba(23,32,51,.08);
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at 12% 20%,rgba(21,88,166,.08),transparent 30%),
radial-gradient(circle at 88% 80%,rgba(242,185,0,.10),transparent 28%),#fff}
.login{width:min(1080px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 60px rgba(23,32,51,.12);overflow:hidden}
.login-art{padding:40px;min-height:650px;background:linear-gradient(145deg,#f9fbff,#eef4fb);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.math-bg{position:absolute;inset:0;opacity:.08;font-size:30px;line-height:2.4;overflow:hidden;padding:25px;pointer-events:none}
.logo{width:150px;height:150px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:1}
.login-art h1{font-size:42px;margin:22px 0 5px;color:var(--primary2);z-index:1}.login-art p{margin:0;z-index:1;font-weight:600;color:#44546a}
.tagline{margin-top:10px;color:var(--muted)!important;font-weight:500!important}
.login-form{padding:50px;display:flex;flex-direction:column;justify-content:center}.login-form h2{margin:0 0 8px;font-size:28px}.login-form .sub{color:var(--muted);margin-bottom:28px}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}.role button{border:1px solid var(--line);background:#fff;padding:13px;border-radius:12px;font-weight:700;color:var(--muted)}.role button.active{background:#eef5ff;border-color:#8db5e8;color:var(--primary)}
label{font-size:14px;font-weight:700;margin:12px 0 7px;display:block}input,select,textarea{width:100%;border:1px solid #cfd7e3;border-radius:10px;padding:12px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#7ba8de;box-shadow:0 0 0 3px rgba(21,88,166,.1)}
.primary{background:linear-gradient(135deg,var(--primary),#2875ca);color:#fff;border:0;border-radius:11px;padding:13px 18px;font-weight:800}.secondary{background:#fff;color:var(--primary);border:1px solid #b8cbe3;border-radius:10px;padding:11px 15px;font-weight:700}.danger{background:#fff0f0;color:var(--danger);border:1px solid #efc2c2;border-radius:10px;padding:10px 14px;font-weight:700}
.demo{margin-top:20px;background:#f7f9fc;border:1px solid var(--line);padding:13px;border-radius:10px;font-size:13px;color:var(--muted)}.demo b{color:var(--text)}

.grid{display:grid;gap:16px}.cards4{grid-template-columns:repeat(4,minmax(0,1fr))}.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}.cards2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px;font-size:16px}.metric{font-size:29px;font-weight:850;color:var(--primary2)}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:flex;flex-direction:column;gap:9px}.item{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#eaf8f0;color:var(--success)}.wait{background:#fff7dd;color:#986f00}.info{background:#edf5ff;color:var(--primary)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;color:var(--muted)}.tabs button.active{background:#eef5ff;color:var(--primary);border-color:#b7d1ef}
table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:#68778a;background:#fafbfd}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.schedule th,.schedule td{text-align:center;min-width:95px}.schedule td{height:52px}.schedule .subject{font-weight:800;color:var(--primary2)}.notice{padding:12px 14px;border-left:4px solid var(--primary);background:#f3f7fd;border-radius:8px;color:#4a5a70;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.4);display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.modalbox{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.2)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#f1f5f9;border-radius:8px;padding:7px 10px}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.cards4{grid-template-columns:repeat(2,1fr)}.login{grid-template-columns:1fr}.login-art{min-height:420px}.sidebar .section{display:none}}
@media(max-width:620px){.content{padding:14px}.cards4,.cards3,.cards2,.formgrid{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.login-form{padding:28px}.login-art h1{font-size:34px}.logo{width:120px;height:120px}}
</style>

function schedulePage(){
 const teacher=state.logged.role==="teacher";let grade=teacher?"9º Ano A":state.logged.grade;const rows=state.schedules[grade]||[];
 shell("Horário de Aula","schedule",`<div class="card"><div class="row"><div><h3>Horário escolar</h3><div class="muted">${teacher?"Cadastre e edite o horário de cada turma.":"Consulte seu horário de aula."}</div></div>${teacher?`<div><select id="gradeSel" onchange="showSchedule(this.value)">${["9º Ano A","9º Ano B","9º Ano C","9º Ano E","9º Ano F","9º Ano G"].map(g=>`<option ${g===grade?"selected":""}>${g}</option>`).join("")}</select><button class="primary" style="margin-left:8px" onclick="newScheduleRow()">+ Novo horário</button></div>`:""}</div><div id="scheduleArea">${scheduleTable(grade,rows,teacher)}</div></div>`)
}
function scheduleTable(grade,rows,teacher){return `<h3 style="margin-top:20px">${grade}</h3><div style="overflow:auto"><table class="schedule"><thead><tr><th>Horário</th><th>Segunda</th><th>Terça</th><th>Quarta</th><th>Quinta</th><th>Sexta</th></tr></thead><tbody>${rows.map((r,ri)=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map((x,di)=>`<td>${teacher?`<select onchange="changeCell('${grade}',${ri},${di+1},this.value)"><option ${x==="Matemática"?"selected":""}>Matemática</option><option ${x==="Ciências"?"selected":""}>Ciências</option><option ${x==="—"?"selected":""}>—</option></select>`:`<span class="subject">${x}</span>`}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function showSchedule(g){document.getElementById("scheduleArea").innerHTML=scheduleTable(g,state.schedules[g]||[],true)}
function changeCell(g,r,c,v){state.schedules[g][r][c]=v;save()}
function newScheduleRow(){const g=document.getElementById("gradeSel").value;const time=prompt("Informe o horário (ex.: 10:50–11:40):","10:50–11:40");if(!time)return;state.schedules[g].push([time,"—","—","—","—","—"]);save();showSchedule(g)}
function performancePage(){
 const teacher=state.logged.role==="teacher";
 if(teacher)shell("Desempenho da Turma","performance",`<div class="grid cards3"><div class="card"><div class="muted">Média da turma</div><div class="metric">7,8</div></div><div class="card"><div class="muted">Atividades entregues</div><div class="metric">32/42</div></div><div class="card"><div class="muted">Taxa de conclusão</div><div class="metric">76%</div></div></div><div class="card" style="margin-top:16px"><h3>Desempenho por atividade</h3><div class="list">${state.activities.map(a=>`<div class="item row"><span>${esc(a.title)}<small class="muted"> · ${a.subject}</small></span><b>${(7+Math.random()*2).toFixed(1)}</b></div>`).join("")}</div></div>`);else{const gs=state.grades.filter(g=>g.student===state.logged.login);const avg=gs.length?gs.reduce((a,b)=>a+b.grade,0)/gs.length:0;shell("Meu Desempenho","performance",`<div class="grid cards3"><div class="card"><div class="muted">Média geral</div><div class="metric">${avg.toFixed(1).replace(".",",")}</div></div><div class="card"><div class="muted">Atividades entregues</div><div class="metric">${gs.length}</div></div><div class="card"><div class="muted">Taxa de conclusão</div><div class="metric">85%</div></div></div><div class="card" style="margin-top:16px"><h3>Notas por atividade</h3><table><thead><tr><th>Atividade</th><th>Disciplina</th><th>Nota</th></tr></thead><tbody>${gs.map(g=>`<tr><td>${esc(g.title)}</td><td>${g.subject}</td><td><b>${g.grade.toFixed(1)}</b></td></tr>`).join("")}</tbody></table></div>`)}
}
function assessmentsPage(){shell("Avaliações","assessments",`<div class="card"><h3>Provas e simulados</h3><div class="list"><div class="item"><b>Prova Bimestral — Matemática</b><span class="badge ok">Disponível</span></div><div class="item"><b>Prova de Ciências</b><span class="badge ok">Disponível</span></div><div class="item"><b>Simulado — Matemática</b><span class="badge info">Programado</span></div></div></div>`)}
function messagesPage(){
 const msgs=state.logged.role==="teacher"?state.messages:state.messages.filter(m=>m.to===state.logged.login);
 shell("Mensagens","messages",`<div class="card"><div class="row"><h3>${state.logged.role==="teacher"?"Mensagens enviadas":"Mensagens recebidas"}</h3>${state.logged.role==="teacher"?`<button class="primary" onclick="newMessage()">+ Nova mensagem</button>`:""}</div><div class="list" style="margin-top:14px">${msgs.map(m=>`<div class="item"><b>${esc(m.subject)}</b><div class="muted">${state.logged.role==="teacher"?"Para: "+m.to:"De: "+m.from} · ${m.date}</div><p>${esc(m.text)}</p></div>`).join("")}</div></div>`)}
function newMessage(){openModal("Nova mensagem",`<label>Aluno</label><select id="mTo">${state.users.filter(u=>u.role==="student").map(u=>`<option value="${u.login}">${u.name} (${u.login})</option>`).join("")}</select><label>Assunto</label><input id="mSub"><label>Mensagem</label><textarea id="mText" rows="5"></textarea><button class="primary" style="margin-top:15px" onclick="saveMessage()">Enviar mensagem</button>`)}
function saveMessage(){state.messages.unshift({from:state.logged.name,to:mTo.value,subject:mSub.value,text:mText.value,date:new Date().toLocaleDateString("pt-BR")});save();closeModal();messagesPage()}
function reportsPage(){shell("Relatórios","reports",`<div class="card"><h3>Relatório de desenvolvimento bimestral — 9º Ano</h3><p class="muted">Modelo inspirado na estrutura do relatório do material fornecido: aluno, turma, disciplina, aproveitamento, atividades, avaliações e relatório descritivo.</p><div class="formgrid"><div><label>Aluno</label><select id="repStudent">${state.users.filter(u=>u.role==="student").map(u=>`<option value="${u.login}">${u.name}</option>`).join("")}</select></div><div><label>Disciplina</label><select id="repSub"><option>Matemática</option><option>Ciências</option></select></div><div><label>Período</label><select id="repPeriod"><option>1º Bimestre - 2026</option><option>2º Bimestre - 2026</option><option>3º Bimestre - 2026</option><option>4º Bimestre - 2026</option></select></div></div><button class="primary" style="margin-top:16px" onclick="generateReport()">Gerar relatório</button><div id="reportPreview" style="margin-top:16px"></div></div>`)}
function generateReport(){const u=state.users.find(x=>x.login===repStudent.value),gs=state.grades.filter(g=>g.student===u.login&&g.subject===repSub.value);const avg=gs.length?gs.reduce((a,b)=>a+b.grade,0)/gs.length:0;document.getElementById("reportPreview").innerHTML=`<div class="notice"><b>RELATÓRIO DE DESENVOLVIMENTO BIMESTRAL</b><br>Aluno(a): ${esc(u.name)}<br>Turma: ${esc(u.grade)} · Disciplina: ${repSub.value}<br>Aproveitamento médio: ${avg?avg.toFixed(1):"Sem avaliações concluídas"}<br>Itens avaliados: ${gs.length}<br><br>Atividades realizadas: ${gs.length}<br>Relatório descritivo: ${avg?"Apresenta desenvolvimento registrado nas atividades avaliadas.":"Ainda não possui média consolidada no período."}<br><br>Assinatura do professor: ______________________________</div>`}
function studentsPage(filter){
 let arr=state.users.filter(u=>u.role==="student");if(filter)arr=arr.filter(u=>u.grade===filter);
 shell("Alunos","students",`<div class="row" style="margin-bottom:15px"><div class="tabs"><button onclick="studentsPage()">Todos</button>${["9º Ano A","9º Ano B","9º Ano C","9º Ano E","9º Ano F","9º Ano G"].map(g=>`<button onclick="studentsPage('${g}')">${g}</button>`).join("")}</div><button class="primary" onclick="newStudent()">+ Cadastrar aluno</button></div><div class="card"><table><thead><tr><th>Aluno</th><th>Turma</th><th>Login</th><th>Ações</th></tr></thead><tbody>${arr.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${u.grade}</td><td>${esc(u.login)}</td><td><button class="secondary" onclick="openStudent('${u.login}')">Ver</button></td></tr>`).join("")}</tbody></table></div>`)
}
function newStudent(){openModal("Cadastrar aluno",`<div class="formgrid"><div><label>Nome completo</label><input id="sName"></div><div><label>Turma</label><select id="sGrade">${["9º Ano A","9º Ano B","9º Ano C","9º Ano E","9º Ano F","9º Ano G"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Login</label><input id="sLogin" placeholder="ex.: joaosilva"></div><div><label>Senha</label><input id="sPass" placeholder="ex.: 2344"></div></div><button class="primary" style="margin-top:16px" onclick="saveStudent()">Cadastrar aluno</button>`)}
function saveStudent(){if(!sName.value||!sLogin.value||!sPass.value)return alert("Preencha todos os campos.");if(state.users.some(u=>u.login===sLogin.value))return alert("Esse login já existe.");state.users.push({name:sName.value,login:sLogin.value,password:sPass.value,role:"student",grade:sGrade.value});save();closeModal();studentsPage()}
function openStudent(login){const u=state.users.find(x=>x.login===login),gs=state.grades.filter(g=>g.student===login);openModal(u.name,`<div class="grid cards2"><div class="card"><div class="muted">Turma</div><b>${u.grade}</b></div><div class="card"><div class="muted">Login</div><b>${u.login}</b></div></div><h3 style="margin-top:18px">Desempenho</h3>${gs.length?gs.map(g=>`<div class="item row"><span>${esc(g.title)} · ${g.subject}</span><b>${g.grade.toFixed(1)}</b></div>`).join(""):`<div class="empty">Nenhuma avaliação lançada.</div>`}`)}
function profilePage(){shell("Meu Perfil","profile",`<div class="card" style="max-width:650px"><h3>Informações do aluno</h3><div class="formgrid"><div><label>Nome</label><input value="${esc(state.logged.name)}" disabled></div><div><label>Turma</label><input value="${esc(state.logged.grade)}" disabled></div><div class="full"><label>Usuário</label><input value="${esc(state.logged.login)}" disabled></div></div><button class="secondary" style="margin-top:15px" onclick="alert('Para alterar a senha, solicite ao professor.')">Alterar senha</button></div>`)}
function openModal(title,body){modal.classList.add("open");modalTitle.textContent=title;modalBody.innerHTML=body}
function closeModal(){modal.classList.remove("open")}
function renderApp(){if(!state.logged)return loginScreen();homePage()}
loginScreen();
</script>
</body>
</html>
